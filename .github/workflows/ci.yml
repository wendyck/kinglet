name: ci

# §13 Q1 made these load-bearing. Deferring the VPC endpoints left tool denial
# as the primary exfiltration control, so the checks that prove containment have
# to run on every change rather than when someone remembers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r reviewer/requirements.txt \
                      boto3 pytest pyflakes

      - name: Lint
        run: python -m pyflakes src/ tests/ scripts/replay.py scripts/redteam.py

      - name: Unit tests
        run: python -m pytest tests/unit -q

      # Runs every adversarial corpus case through the sanitizer and the
      # renderer and asserts nothing live survives. No model and no AWS needed,
      # which is exactly why it can gate every push.
      - name: Containment — sanitizer and renderer
        run: python -m pytest tests/unit/test_sanitize.py tests/unit/test_render.py -q

      - name: Containment — the fs-readonly jail
        run: python -m pytest tests/unit/test_fs_readonly.py -q

      # --no-tree keeps this hermetic. The default now fetches each fixture's
      # tarball from GitHub, which is the right behaviour for a developer and the
      # wrong one for CI: eight anonymous API calls from shared runner IPs is a
      # rate limit waiting to happen, and a network flake here would look like a
      # kinglet regression. The tree-fetching path is exercised by the eval job.
      - name: Replay every real fixture, floor only
        run: python scripts/replay.py --all --no-model --no-tree

      # The corpus is an index of what "contained" is counted against, and it
      # used to be able to claim coverage it did not have.
      - name: The adversarial corpus names tests that exist
        run: python -m pytest tests/unit/test_redteam_corpus.py -q

      - name: The security banner comes only from the alerts API
        run: python -m pytest tests/unit/test_security_banner.py -q

  posture:
    # The build-time policy gate is the other half: it fails the image build if
    # the tool surface drifts. Running it here means a config change is caught
    # in review rather than at deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the reviewer image (the policy gate runs inside it)
        run: |
          mkdir -p reviewer/vendor
          cp src/common/safe_tar.py reviewer/vendor/safe_tar.py
          docker build -t kinglet-reviewer:ci reviewer/

      - name: The gate must reject a tampered posture
        run: |
          set -e
          python - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("reviewer/openclaw/openclaw.json").read_text())
          cfg["tools"]["elevated"]["enabled"] = True
          pathlib.Path("/tmp/tampered.json").write_text(json.dumps(cfg))
          PY
          chmod 600 /tmp/tampered.json
          if docker run --rm -v /tmp:/t:ro -e OPENCLAW_CONFIG_PATH=/t/tampered.json \
               --entrypoint python3 kinglet-reviewer:ci /opt/kinglet/policy_gate.py; then
            echo "::error::the policy gate accepted a config with elevated tools enabled"
            exit 1
          fi
          echo "gate correctly rejected the tampered config"

  evals:
    # The live half: the adversarial corpus run against the real model.
    #
    # Gated on the inputs that can actually change a verdict — the skill, the
    # prompt, the openclaw config and the corpus itself — because each run costs
    # real Bedrock spend (~$3-4 for the 7 live cases) and takes ~15 minutes.
    # Everything above is deterministic and gates every push instead.
    #
    # ARM runners, not qemu: the reviewer image is linux/arm64 because Fargate
    # is, and emulating it on an x86 runner is both slow and a different thing
    # from what production runs.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Path filtering lives here rather than in `on:` so the deterministic jobs
      # above keep running for every change.
      - name: Decide whether a verdict could have changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(reviewer/skills/|reviewer/prompt\.md|reviewer/openclaw/|tests/fixtures/adversarial/|scripts/redteam\.py)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no eval-relevant path changed; skipping the model run"
          fi

      - name: Guard against a silent no-op
        if: steps.scope.outputs.run == 'true'
        run: |
          if [ -z "${{ vars.KINGLET_EVAL_ROLE_ARN }}" ]; then
            echo "::error::no eval role configured; refusing to report a pass for a run that did not happen"
            exit 1
          fi

      - name: Assume the eval role
        if: steps.scope.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.KINGLET_EVAL_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: kinglet-evals-${{ github.run_id }}

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt boto3 pyyaml

      - name: Build the reviewer image
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p reviewer/vendor
          cp src/common/safe_tar.py reviewer/vendor/safe_tar.py
          docker build --platform=linux/arm64 -t kinglet-reviewer:dev reviewer/

      - name: The adversarial corpus, against the real model
        if: steps.scope.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          install -m 600 reviewer/openclaw/openclaw.json /tmp/openclaw.json
          python scripts/redteam.py --config /tmp/openclaw.json
