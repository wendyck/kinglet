AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  kinglet — automated, security-conscious triage of Dependabot pull requests.
  Phase 1: the Tier 1 pipeline with a stub reviewer. ECS and the VPC arrive with
  the Tier 2 container in Phase 2. Per §13 Q1 that VPC is a public subnet with no
  NAT and no interface endpoints, so Phase 2 adds compute cost but not the ~$29/mo
  of network plumbing.

Parameters:
  AppSecretName:
    Type: String
    Default: kinglet/github-app
    Description: Secrets Manager secret holding {app_id, private_key}.
  InputGuardrailId:
    Type: String
    Default: "460y8sih9wtm"
    Description: >
      Tier 1 guardrail over untrusted PR-derived text. Created by hand in
      Phase 0; still to be adopted into this stack (SPEC.md §9).
  InputGuardrailVersion:
    Type: String
    Default: "2"
    Description: >
      v2 drops the two denied topics. They were systematic false positives:
      Dependabot's own PR body lists @dependabot commands, and an SDK changelog
      discusses api_key. The trained PROMPT_ATTACK filter judged both correctly.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Starts DISABLED on purpose. Kinglet writes to real pull requests, so the
      schedule is turned on deliberately (Phase 4), not by deploying.
  MaxStartsPerRun:
    Type: String
    Default: "2"
  MaxStartsPerDay:
    Type: String
    Default: "25"
    Description: >
      Hard ceiling on reviews per UTC day, enforced in the poller. AWS has no
      per-day Bedrock cost cap — the per-day token quotas are AWS-set ceilings
      of tens of millions and are not adjustable — so this is the real-time
      control. Budgets below are a lagging backstop, not a cap.
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Where alarms and budget notifications actually go. Empty means nowhere:
      the topic exists, every alarm publishes to it, and no one is told. That
      was the live state until 2026-09-20, which matters because §13 Q1 deferred
      the VPC endpoints on the grounds that the budget guard is required rather
      than optional. AWS sends a confirmation email; the subscription is
      `PendingConfirmation` until someone clicks it.
  DailyBedrockBudgetUSD:
    Type: String
    Default: "5"
  MonthlyBedrockBudgetUSD:
    Type: String
    Default: "40"
  BotLogin:
    Type: String
    Default: "kinglet-bot[bot]"
  ReviewerImageTag:
    Type: String
    Default: "phase2"
  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  OutputGuardrailId:
    Type: String
    Default: "lubjaymwc18i"
    Description: Provider-attached guardrail, output-side filtering only (§8).
  ReviewerEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      false keeps the Phase 1 stub in the pipeline. Flip to true to route the
      Review state to the Tier 2 container. The switch lives in the state
      machine rather than in CloudFormation, so both paths stay deployed and
      flipping back is a parameter change, not a stack rebuild.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 120
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        KINGLET_BUCKET: !Ref ArtifactBucket
        KINGLET_APP_SECRET: !Ref AppSecretName
        KINGLET_CONFIG: /var/task/config/repos.yml
        KINGLET_BOT_LOGIN: !Ref BotLogin
        KINGLET_GUARDRAIL_ID: !Ref InputGuardrailId
        KINGLET_GUARDRAIL_VERSION: !Ref InputGuardrailVersion

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  ScheduleEnabled: !Equals [!Ref ScheduleState, ENABLED]

Resources:

  # ── storage ────────────────────────────────────────────────────────────────

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "kinglet-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # Denies anything that is not TLS. With no VPC endpoint to condition on
  # (§13 Q1), the reviewer's access to bundles/ and results/ is scoped by its
  # task-role IAM in Phase 2 rather than by a bucket policy.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${ArtifactBucket.Arn}"
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kinglet-alerts
      DisplayName: kinglet

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # AWS Budgets publishes from its own service principal, so the topic has to
  # let it in explicitly.
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgets
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ── spend guards (§13 Q1) ──────────────────────────────────────────────────
  #
  # These are a *backstop*, not a cap. AWS cost data lags by hours, so a budget
  # cannot stop spend as it happens; the poller's per-day execution ceiling is
  # what does that. These catch what the poller cannot see — most importantly a
  # leaked task-role credential invoking Bedrock from somewhere else.

  DailyBedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: kinglet-bedrock-daily
        BudgetType: COST
        TimeUnit: DAILY
        BudgetLimit:
          Amount: !Ref DailyBedrockBudgetUSD
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic

  MonthlyBedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: kinglet-bedrock-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBedrockBudgetUSD
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic

  # ── functions ──────────────────────────────────────────────────────────────

  PollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kinglet-poller
      CodeUri: src/
      Handler: poller.app.handler
      Timeout: 300
      Environment:
        Variables:
          KINGLET_STATE_MACHINE_ARN: !Ref ReviewStateMachine
          KINGLET_MAX_STARTS: !Ref MaxStartsPerRun
          KINGLET_MAX_STARTS_PER_DAY: !Ref MaxStartsPerDay
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppSecretName}-*"
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref ReviewStateMachine
            - Effect: Allow
              Action: states:ListExecutions
              Resource: !Ref ReviewStateMachine

  PrepareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kinglet-prepare
      CodeUri: src/
      Handler: prepare.app.handler
      Timeout: 600
      MemorySize: 1536
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          KINGLET_REVIEWER_MODE: !Ref ReviewerEnabled
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppSecretName}-*"
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "${ArtifactBucket.Arn}/bundles/*"
                - !Sub "${ArtifactBucket.Arn}/meta/*"
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"

  # Phase 1 only. Phase 2 replaces this with the Fargate task (§5.3), and this
  # function — the only thing that reads meta/ and writes results/ — goes away.
  StubReviewerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kinglet-stub-reviewer
      CodeUri: src/
      Handler: stub_reviewer.app.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ArtifactBucket.Arn}/meta/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ArtifactBucket.Arn}/results/*"

  FinalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kinglet-finalize
      CodeUri: src/
      Handler: finalize.app.handler
      Timeout: 300
      Environment:
        Variables:
          KINGLET_SNS_TOPIC: !Ref AlertTopic
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppSecretName}-*"
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ArtifactBucket.Arn}/meta/*"
                - !Sub "${ArtifactBucket.Arn}/results/*"
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic

  # ── orchestration ──────────────────────────────────────────────────────────

  ReviewStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: kinglet-review
      Type: STANDARD
      DefinitionUri: statemachine/review.asl.json
      DefinitionSubstitutions:
        PrepareFunctionArn: !GetAtt PrepareFunction.Arn
        ReviewerFunctionArn: !GetAtt StubReviewerFunction.Arn
        FinalizeFunctionArn: !GetAtt FinalizeFunction.Arn
        ClusterArn: !GetAtt ReviewerCluster.Arn
        TaskDefinitionArn: !Ref ReviewerTaskDefinition
        SubnetId: !Ref ReviewerSubnet
        SecurityGroupId: !GetAtt ReviewerSecurityGroup.GroupId
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PrepareFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StubReviewerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FinalizeFunction
        - Statement:
            - Effect: Allow
              Action: [ecs:RunTask, ecs:StopTask, ecs:DescribeTasks]
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                - !GetAtt ReviewerTaskRole.Arn
                - !GetAtt ReviewerExecutionRole.Arn
            - Effect: Allow
              Action: [events:PutTargets, events:PutRule, events:DescribeRule]
              Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-poller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PollerFunction.Arn

  PollSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: kinglet-poll
      Description: Polls enrolled repos for open Dependabot PRs (SPEC.md §5.1).
      State: !Ref ScheduleState
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: rate(10 minutes)
      Target:
        Arn: !GetAtt PollerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

  # ── alarms ─────────────────────────────────────────────────────────────────

  StateMachineFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kinglet-review-failures
      AlarmDescription: >
        A review execution failed (SPEC.md §5.8). One failure is enough to
        report: reviews are independent, so a single failure is a real PR that
        did not get reviewed, not noise to be averaged away.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref ReviewStateMachine
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Two consecutive failed runs, not three failures somewhere in an hour.
  #
  # This was `Sum > 2 over 3600s`. The poller runs every ten minutes, so that
  # meant three of the last six runs had to fail *and* the hour had to elapse:
  # kinglet could be dead for an hour before anyone heard. With a 600s period
  # each datapoint is exactly one run, so 2-of-2 is "it failed twice in a row"
  # and fires in about 20 minutes. One transient GitHub 5xx still says nothing.
  PollerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kinglet-poller-errors
      AlarmDescription: >
        Two consecutive poller runs failed, so no PR is being picked up.
        Check the poller's logs; GitHub App credentials and rate limits are the
        usual causes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PollerFunction
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # The failure mode no error rate can see: the poller stops running at all.
  #
  # `Errors` only exists when something is invoked, so a schedule that is
  # disabled, deleted or broken produces no datapoints and no alarm — silence
  # that reads exactly like health. This is the one alarm that must treat
  # missing data as breaching.
  #
  # Only exists when the schedule is ENABLED, because when it is off, silence
  # is the correct state and this would fire forever.
  PollerSilenceAlarm:
    Condition: ScheduleEnabled
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kinglet-poller-silent
      AlarmDescription: >
        The poller has not run in 30 minutes although the schedule is ENABLED.
        Expect three runs in that window. Check the EventBridge schedule
        kinglet-poll and the scheduler role.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref PollerFunction
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ── Tier 2: the reviewer container (§5.3, §13 Q1) ──────────────────────────
  #
  # One public subnet, an internet gateway, no NAT and no interface endpoints.
  # §13 Q1 sets out why: the endpoints cost more than the rest of the system and
  # protect public repository data plus a short-lived, narrowly scoped task role.
  # The container's isolation is the task role, the read-only filesystem, the
  # denied tool surface and a fresh container per PR — not the network.

  ReviewerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.90.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: kinglet}]

  ReviewerIgw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: kinglet}]

  ReviewerIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ReviewerVpc
      InternetGatewayId: !Ref ReviewerIgw

  ReviewerSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ReviewerVpc
      CidrBlock: 10.90.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: kinglet-reviewer}]

  ReviewerRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ReviewerVpc

  ReviewerDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: ReviewerIgwAttachment
    Properties:
      RouteTableId: !Ref ReviewerRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ReviewerIgw

  ReviewerSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ReviewerSubnet
      RouteTableId: !Ref ReviewerRouteTable

  # Egress-only by construction: no ingress rules at all, and nothing listens
  # in the container anyway (§8 — the reviewer runs `agent exec`, not a gateway).
  ReviewerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kinglet reviewer - egress only, no inbound
      VpcId: !Ref ReviewerVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Bedrock, ECR, S3 and Logs over public endpoints

  ReviewerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kinglet-reviewer
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep 5 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
            "action":{"type":"expire"}}]}

  ReviewerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: kinglet
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ReviewerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /kinglet/reviewer
      RetentionInDays: 14

  # Pulls the image and writes logs. Holds nothing the container can use.
  ReviewerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # The only credential the untrusted container holds. Read one prefix, write
  # another, invoke one model. No Secrets Manager, no meta/ (§9).
  ReviewerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: reviewer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/bundles/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/results/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream,
                         bedrock:Converse, bedrock:ConverseStream]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
              # Explicitly not: secretsmanager:*, s3 on meta/*, states:*.
              - Effect: Deny
                Action: secretsmanager:*
                Resource: "*"
              - Effect: Deny
                Action: s3:*
                Resource: !Sub "${ArtifactBucket.Arn}/meta/*"

  ReviewerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kinglet-reviewer
      Cpu: "1024"
      # §5.3 said 2 GB. On Fargate a tmpfs is backed by task memory, so the
      # three mounts below are subtracted from whatever the runtime gets —
      # 2 GB left openclaw with too little and it failed with ENOSPC.
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ReviewerExecutionRole.Arn
      TaskRoleArn: !GetAtt ReviewerTaskRole.Arn
      ContainerDefinitions:
        - Name: reviewer
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ReviewerRepository}:${ReviewerImageTag}"
          Essential: true
          ReadonlyRootFilesystem: true
          User: "10001"
          # Two tmpfs mounts (F15): the bundle is frozen read-only after
          # extraction, so openclaw state cannot live under /work.
          # Fargate creates tmpfs mounts root-owned regardless of what the
          # image sets, so the run user is given them explicitly. Without this
          # the entrypoint cannot create /work/repo.
          LinuxParameters:
            Tmpfs:
              - ContainerPath: /work
                Size: 512
                MountOptions: ["uid=10001", "gid=10001", "mode=0700"]
              - ContainerPath: /state
                Size: 1024
                MountOptions: ["uid=10001", "gid=10001", "mode=0700"]
              - ContainerPath: /tmp
                Size: 512
                MountOptions: ["uid=10001", "gid=10001", "mode=0700"]
          Environment:
            - Name: KINGLET_BUCKET
              Value: !Ref ArtifactBucket
            - Name: KINGLET_MODEL
              Value: !Sub "amazon-bedrock/${BedrockModelId}"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ReviewerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: reviewer

Outputs:
  BucketName:
    Description: Artifact bucket (bundles/, meta/, results/)
    Value: !Ref ArtifactBucket
  StateMachineArn:
    Value: !Ref ReviewStateMachine
  PollerFunction:
    Value: !Ref PollerFunction
  AlertTopic:
    Value: !Ref AlertTopic
  ScheduleState:
    Description: Turn the schedule on with --parameter-overrides ScheduleState=ENABLED
    Value: !Ref ScheduleState
  DailyReviewCap:
    Description: Hard per-day review ceiling enforced in the poller (§13 Q1)
    Value: !Ref MaxStartsPerDay
  ReviewerRepositoryUri:
    Value: !GetAtt ReviewerRepository.RepositoryUri
  ReviewerMode:
    Description: "true = Tier 2 container, false = Phase 1 stub"
    Value: !Ref ReviewerEnabled
