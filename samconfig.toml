# Pinned deploy parameters.
#
# CloudFormation keeps a stack's stored parameter values; changing a default in
# template.yaml does not move an existing stack. That silently left the input
# guardrail on v1 after v2 was published, so the values live here explicitly.

version = 0.1

[default.global.parameters]
stack_name = "kinglet"
region = "us-west-2"
profile = "kinglet"

[default.build.parameters]
use_container = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
  "ScheduleState=DISABLED",
  "InputGuardrailId=460y8sih9wtm",
  "InputGuardrailVersion=2",
  "MaxStartsPerRun=2",
  "MaxStartsPerDay=25",
  # Raised 2026-09-20 for Phase 3 development, and deliberately kept.
  # Not a Phase 4 restore item: it comes down when the owner says so.
  # A full red-team corpus pass is ~$3-4 and a real-fixture pass ~$3, so $5/day
  # was tripping on ordinary eval work. These are lagging notifications, never a
  # cap — and note they currently notify nobody: the kinglet-alerts topic has no
  # subscriptions. The real-time control is
  # MaxStartsPerDay above, which is deliberately NOT raised — it gates
  # poller-started reviews, and §13 Q1 makes it load-bearing now that the VPC
  # endpoints are deferred.
  "DailyBedrockBudgetUSD=15",
  "MonthlyBedrockBudgetUSD=80",
  "ReviewerEnabled=true",
  "ReviewerImageTag=phase2",
  "OutputGuardrailId=lubjaymwc18i",
]
